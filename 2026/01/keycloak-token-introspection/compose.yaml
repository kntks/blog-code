services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: ["start-dev"]
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data: {}