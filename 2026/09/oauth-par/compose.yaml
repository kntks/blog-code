services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: ["start-dev", "--import-realm", "--verbose"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./kc-data/import:/opt/keycloak/data/import:ro
      - ./kc-data/export:/opt/keycloak/data/export

volumes:
  keycloak-data:
