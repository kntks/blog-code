services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: ["start-dev"]
    volumes:
      - keycloak_data:/opt/keycloak/data

  db:
    image: postgres:18.3-trixie
    command: ["postgres", "-c", "TimeZone=Asia/Tokyo"]
    environment:
      - POSTGRES_DB=sample-db
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=password
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host

volumes:
  keycloak_data: {}
  db_data: {}